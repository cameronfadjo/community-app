name: Checks

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch replaces a run still in progress
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apps:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The apps import the shared packages from their built output
      - name: Build shared packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Type-check
        run: pnpm type-check

      - name: Lint the dashboards
        run: pnpm --filter @community/admin-dashboard --filter @community/partner-dashboard lint

      - name: Test
        run: pnpm test

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Firestore emulator, which the rules are tested in, runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # The tests use the same helpers as the apps, from their built output
      - name: Build shared packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Test the security rules
        run: pnpm --filter @community/rules-tests test:rules

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/community/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/community/functions/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
